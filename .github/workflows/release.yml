name: Release

on:
  push:
    branches: [main]
    # When release-please creates the tag, goreleaser attaches binaries + signed
    # checksums to the existing GitHub Release so the Terraform Registry can ingest it.
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: go
          package-name: terraform-provider-openrouter
          include-component-in-tag: false
          changelog-types: >
            [
              {"type":"feat","section":"Features","hidden":false},
              {"type":"fix","section":"Bug Fixes","hidden":false},
              {"type":"perf","section":"Performance","hidden":false},
              {"type":"refactor","section":"Refactoring","hidden":false},
              {"type":"docs","section":"Documentation","hidden":false},
              {"type":"chore","section":"Miscellaneous","hidden":false},
              {"type":"ci","section":"Miscellaneous","hidden":false}
            ]

  goreleaser:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify GPG signing key
        run: |
          echo "Fingerprint: ${{ steps.import_gpg.outputs.fingerprint }}"
          echo "KeyID:       ${{ steps.import_gpg.outputs.keyid }}"
          # Fail fast if the wrong key was wired up
          if [ "${{ steps.import_gpg.outputs.keyid }}" != "2B11E3055D7BAED4" ]; then
            echo "::error::Expected signing key 2B11E3055D7BAED4, got ${{ steps.import_gpg.outputs.keyid }}"
            exit 1
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
