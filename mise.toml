[tools]
go = "1.25"
golangci-lint = "latest"
goreleaser = "latest"
gh = "latest"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "latest"

[env]
GOTOOLCHAIN = "local"

[tasks.default]
description = "List available tasks"
alias = "h"
run = ["mise tasks"]

[tasks.build]
description = "Build the provider binary"
alias = "b"
run = [
  "mkdir -p .build/",
  "go build -o .build/terraform-provider-openrouter",
]
run_windows = [
  "mkdir -p .build",
  "go build -o .build\\terraform-provider-openrouter",
]
sources = ["openrouter/**/*.go", "main.go", "go.mod", "go.sum"]
outputs = [".build/terraform-provider-openrouter"]

[tasks.fmt]
description = "Format Go code"
alias = "f"
run = ["go fmt ./..."]

[tasks.tidy]
description = "Clean up go.mod and go.sum"
run = ["go mod tidy"]

[tasks.vet]
description = "Run go vet"
run = ["go vet ./..."]

[tasks.test]
description = "Run unit tests"
alias = "t"
run = ["go test -v ./..."]

[tasks.lint]
description = "Run golangci-lint"
alias = "l"
run = ["golangci-lint run ./..."]

[tasks.doc]
description = "Generate Terraform documentation"
alias = "d"
run = ["tfplugindocs generate --rendered-provider-name OpenRouter --provider-name openrouter"]

[tasks.doc-check]
description = "Check if docs are up to date"
alias = "dc"
depends = ["doc"]
run = ["scripts/docs-check.sh"]

[tasks.validate]
description = "Run all validation checks"
alias = "v"
depends = ["fmt", "vet", "lint", "test"]

[tasks.ci]
description = "Run CI checks (build + vet + test + lint)"
depends = ["build", "vet", "test", "lint"]

[tasks.release]
description = "Build and release with goreleaser"
alias = "r"
run = ["goreleaser release --clean"]

[tasks.install]
description = "Install provider to terraform plugins dir"
run = [
  "mise run build",
  "mkdir -p ~/.terraform.d/plugins/registry.terraform.io/echohello-dev/openrouter/0.0.1/darwin_arm64",
  "cp .build/terraform-provider-openrouter ~/.terraform.d/plugins/registry.terraform.io/echohello-dev/openrouter/0.0.1/darwin_arm64/",
]
run_windows = [
  "mise run build",
  "if not exist \"%USERPROFILE%\\.terraform.d\\plugins\\registry.terraform.io\\echohello-dev\\openrouter\\0.0.1\\windows_amd64\" mkdir \"%USERPROFILE%\\.terraform.d\\plugins\\registry.terraform.io\\echohello-dev\\openrouter\\0.0.1\\windows_amd64\"",
  "copy .build\\terraform-provider-openrouter \"%USERPROFILE%\\.terraform.d\\plugins\\registry.terraform.io\\echohello-dev\\openrouter\\0.0.1\\windows_amd64\\",
]

[settings]
experimental = true
